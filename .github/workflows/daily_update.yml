name: Daily HKEX HSI Options Update

on:
  schedule:
    - cron: '45 8 * * 1-5'
    - cron: '30 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && playwright install chromium --with-deps
      - run: python build_hsi_dashboard.py
      - run: |
          git config user.name "HKEX-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html latest_hsi_options.json latest_hsi_options.csv history_data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update" && git push)
