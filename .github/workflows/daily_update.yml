"""
HSI Options & Futures 3-Page Dashboard Builder (100% Python Stdlib - Zero External Deps)
- Fixes Big5/CP950 HKEX encoding + adds English hsioe{yymmdd}.htm fallback
- Page 1: 期權鏈分佈表 (HSI Cash Close, Max Pain, PCR, Futures Gross/Net OI + Full Options Chain)
- Page 2: 四大方向與六大輔助分析總表 (All 9 Core & Auxiliary Analytical Dimensions)
- Page 3: 實戰操盤策略與風控紀律 (Directional Alert, +300/-100 Plan, Weekly 2-Trade Rules)
"""

import html as html_lib
import io
import json
import os
import re
import urllib.request
import zipfile
from datetime import datetime, timedelta
from zoneinfo import ZoneInfo

HKT = ZoneInfo("Asia/Hong_Kong")
HEADERS = {
    "User-Agent": (
        "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
        "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36"
    )
}


def fetch_bytes(url: str, timeout: int = 25) -> bytes | None:
    try:
        req = urllib.request.Request(url, headers=HEADERS)
        with urllib.request.urlopen(req, timeout=timeout) as resp:
            if resp.status == 200:
                data = resp.read()
                if len(data) > 200:
                    return data
    except Exception as exc:
        print(f"[WARN] Fetch failed {url}: {exc}")
    return None


def decode_hkex_bytes(raw: bytes) -> str:
    """Try UTF-8 first, then Big5-HKSCS / CP950 (HKEX Chinese reports often use Big5)."""
    for enc in ("utf-8", "big5hkscs", "cp950", "big5"):
        try:
            text = raw.decode(enc)
            if "行使價" in text or "未平倉" in text or "STRIKE" in text.upper() or "HANG SENG" in text.upper():
                return text
        except UnicodeDecodeError:
            continue
    return raw.decode("utf-8", errors="ignore")


def strip_html(raw_html: str) -> str:
    text = re.sub(r"<(script|style)[^>]*>.*?</\1>", " ", raw_html, flags=re.S | re.I)
    text = re.sub(r"<br\s*/?>|</tr>|</p>|</div>|</li>", "\n", text, flags=re.I)
    text = re.sub(r"<[^>]+>", " ", text)
    return html_lib.unescape(text)


def parse_int(s: str) -> int:
    s = s.replace(",", "").replace("+", "").strip()
    if not s or s in ("-", "--", "N/A"):
        return 0
    try:
        return int(float(s))
    except ValueError:
        return 0


def fetch_hsi_cash_data() -> dict:
    url = "https://query1.finance.yahoo.com/v8/finance/chart/%5EHSI?interval=1d&range=1mo"
    raw = fetch_bytes(url)
    if not raw:
        return {"price": "待補", "chg": "待補", "pct": "待補", "is_down": False, "hi_20": 0, "lo_20": 0}
    try:
        data = json.loads(raw.decode("utf-8"))
        q = data["chart"]["result"][0]["indicators"]["quote"][0]
        closes = [c for c in q["close"] if c is not None]
        highs = [h for h in q["high"] if h is not None]
        lows = [l for l in q["low"] if l is not None]
        price = closes[-1]
        prev = closes[-2] if len(closes) >= 2 else price
        chg = price - prev
        pct = (chg / prev * 100) if prev else 0.0
        return {
            "price": f"{price:,.2f}",
            "price_num": price,
            "chg": f"{chg:+,.2f}",
            "pct": f"{pct:+.2f}%",
            "is_down": chg < 0,
            "hi_20": round(max(highs)) if highs else 0,
            "lo_20": round(min(lows)) if lows else 0,
        }
    except Exception as exc:
        print(f"[WARN] HSI cash parse error: {exc}")
        return {"price": "待補", "chg": "待補", "pct": "待補", "is_down": False, "hi_20": 0, "lo_20": 0}


def find_latest_options():
    now = datetime.now(HKT)
    for offset in range(6):
        dt = now - timedelta(days=offset)
        if dt.weekday() >= 5:
            continue
        yymmdd = dt.strftime("%y%m%d")
        for url in [
            f"https://www.hkex.com.hk/chi/stat/dmstat/dayrpt/hsioc{yymmdd}.htm",
            f"https://www.hkex.com.hk/eng/stat/dmstat/dayrpt/hsioe{yymmdd}.htm",
        ]:
            raw = fetch_bytes(url)
            if raw:
                page = decode_hkex_bytes(raw)
                if "行使價" in page or "未平倉" in page or "STRIKE" in page.upper() or "OPEN INTEREST" in page.upper():
                    print(f"[OK] Loaded HKEX options report: {url}")
                    return dt.strftime("%Y-%m-%d"), page
    return None, None


def parse_options_oi(page: str) -> dict:
    text = strip_html(page)
    months = sorted({(int(y), int(m)) for y, m in re.findall(r"(\d{2})\s*年\s*(\d{1,2})\s*月", text)})
    front_label = f"20{months[0][0]:02d}年{months[0][1]:02d}月" if months else "即月"

    lines = text.splitlines()
    chain = {}
    seen_front = False
    for line in lines:
        if months and f"{months[0][0]:02d}" in line and f"{months[0][1]}" in line and "月" in line:
            seen_front = True
        if len(months) >= 2 and seen_front and f"{months[1][0]:02d}" in line and f"{months[1][1]}" in line and "月" in line:
            break

        nums = re.findall(r"[-+]?\d[\d,]*", line)
        if len(nums) >= 8:
            strike = None
            for cand in nums[:3]:
                val = parse_int(cand)
                if 15000 <= val <= 35000 and val % 100 == 0:
                    strike = val
                    break
            if not strike:
                continue
            c_vol = parse_int(nums[-6]) if len(nums) >= 10 else parse_int(nums[1])
            c_oi = parse_int(nums[-4])
            c_chg = parse_int(nums[-3]) if len(nums) >= 9 else 0
            p_oi = parse_int(nums[-2])
            p_chg = parse_int(nums[-1])
            p_vol = parse_int(nums[-5]) if len(nums) >= 10 else 0

            if strike not in chain:
                chain[strike] = {"c_vol": c_vol, "c_oi": c_oi, "c_chg": c_chg, "p_oi": p_oi, "p_chg": p_chg, "p_vol": p_vol}

    calls = {k: v["c_oi"] for k, v in chain.items()}
    puts = {k: v["p_oi"] for k, v in chain.items()}
    total_call = sum(calls.values())
    total_put = sum(puts.values())
    pcr = round(total_put / total_call, 2) if total_call > 0 else 0.0
    top_calls = sorted(calls.items(), key=lambda x: x[1], reverse=True)[:3]
    top_puts = sorted(puts.items(), key=lambda x: x[1], reverse=True)[:3]

    all_strikes = sorted(chain.keys())
    max_pain = 0
    if all_strikes:
        best_payout = None
        for settle in all_strikes:
            payout = sum(max(0, settle - k) * v for k, v in calls.items()) + sum(
                max(0, k - settle) * v for k, v in puts.items()
            )
            if best_payout is None or payout < best_payout:
                best_payout = payout
                max_pain = settle

    return {
        "contract": front_label,
        "total_call": total_call,
        "total_put": total_put,
        "pcr": pcr,
        "max_pain": max_pain,
        "top_calls": top_calls,
        "top_puts": top_puts,
        "chain": chain,
    }


def fetch_latest_dtop_futures() -> dict:
    now = datetime.now(HKT)
    for offset in range(6):
        dt = now - timedelta(days=offset)
        if dt.weekday() >= 5:
            continue
        ymd = dt.strftime("%Y%m%d")
        for url in [
            f"https://www.hkex.com.hk/eng/stat/dmstat/oi/DTOP_F_{ymd}.zip",
            f"https://www.hkex.com.hk/eng/stat/dmstat/oi/dtop_f_{ymd}.zip",
        ]:
            raw = fetch_bytes(url)
            if raw and raw[:2] == b"PK":
                print(f"[OK] Loaded HKEX DTOP zip: {url}")
                return parse_dtop_zip(dt.strftime("%Y-%m-%d"), raw)
    return {"date": "待補", "front_gross": "待補", "front_net": "待補", "front_net_chg": "待補", "sum2_net_chg": "待補", "raw_net_chg_int": 0}


def parse_dtop_zip(date_str: str, zip_bytes: bytes) -> dict:
    records = []
    with zipfile.ZipFile(io.BytesIO(zip_bytes)) as zf:
        for name in zf.namelist():
            if not name.lower().endswith((".txt", ".csv", ".htm", ".html")):
                continue
            content = zf.read(name).decode("utf-8", errors="ignore")
            if "HSI" not in content and "HANG SENG INDEX FUTURES" not in content.upper():
                continue
            for line in content.splitlines():
                if re.search(r"\bHSI\b", line) and re.search(r"\d{2}\s*[A-Z]{3}\s*\d{2}|\b[A-Z]{3}-\d{2}\b|\b20\d{2}\b", line):
                    nums = re.findall(r"[-+]?\d[\d,]*", line)
                    if len(nums) >= 5:
                        records.append((line.strip(), nums))
    if not records:
        return {"date": date_str, "front_gross": "待補", "front_net": "待補", "front_net_chg": "待補", "sum2_net_chg": "待補", "raw_net_chg_int": 0}

    front_nums = records[0][1]
    front_gross = parse_int(front_nums[-3]) if len(front_nums) >= 3 else 0
    front_net = parse_int(front_nums[-2]) if len(front_nums) >= 2 else 0
    front_net_chg = parse_int(front_nums[-1]) if len(front_nums) >= 1 else 0
    second_net_chg = parse_int(records[1][1][-1]) if len(records) >= 2 else 0
    return {
        "date": date_str,
        "front_gross": f"{front_gross:,}",
        "front_net": f"{front_net:,}",
        "front_net_chg": f"{front_net_chg:+,}",
        "sum2_net_chg": f"{front_net_chg + second_net_chg:+,}",
        "raw_net_chg_int": front_net_chg + second_net_chg,
    }


def fetch_futures_daily_report() -> dict:
    raw = fetch_bytes("https://www.hkex.com.hk/eng/stat/dmstat/dayrpt/dmreport1.htm")
    if not raw:
        return {"close": "待補", "high": "待補", "low": "待補", "oi": "待補"}
    text = strip_html(raw.decode("utf-8", errors="ignore"))
    for line in text.splitlines():
        if re.search(r"^[A-Z]{3}-\d{2}\b", line.strip()):
            nums = re.findall(r"[-+]?\d[\d,]*", line)
            if len(nums) >= 6:
                return {"high": nums[2], "low": nums[3], "close": nums[4], "oi": nums[-1]}
    return {"close": "待補", "high": "待補", "low": "待補", "oi": "待補"}


